{% extends "base.html" %}
{% block title %}비밀번호 변경 - 관리자{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 40px auto;">
  <h1>🔑 비밀번호 변경</h1>
  <p class="muted">기존 비밀번호를 입력한 후 새 비밀번호를 설정해 주세요.</p>
  <form method="post">
    <label>기존 비밀번호</label>
    <input type="password" name="current_password" required autofocus>

    <label>새 비밀번호</label>
    <input type="password" name="new_password" required minlength="4" placeholder="4자 이상">

    <label>새 비밀번호 확인</label>
    <input type="password" name="confirm_password" required minlength="4">

    <div class="row" style="margin-top: 16px;">
      <button type="submit" class="btn primary">변경하기</button>
      <a class="btn secondary" href="{{ url_for('admin_index') }}">취소</a>
    </div>
  </form>
</div>
{% endblock %}
