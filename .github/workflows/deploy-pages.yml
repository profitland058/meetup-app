name: Deploy ticketing-sim to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/ticketing-sim/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/ticketing-sim

      - id: deployment
        uses: actions/deploy-pages@v4
