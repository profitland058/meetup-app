name: Deploy draw-guess to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'draw-guess/**'
      - '.github/workflows/draw-guess.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-draw-guess
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Stage static files for Pages
        run: |
          rm -rf gh-pages
          mkdir -p gh-pages
          cp draw-guess/templates/index.html gh-pages/index.html
          cd gh-pages
          git init -q
          git add .
          git commit -m "deploy: draw-guess $(date +%Y%m%d-%H%M%S)"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          force_orphan: true
